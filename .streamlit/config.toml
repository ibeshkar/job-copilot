# Streamlit settings for the app (read when you run `streamlit run app/main.py` from the
# project root). Security hardening: see docs/SECURITY.md.

[server]
# Listen on this computer only. Streamlit's default listens on every network interface, and
# the app has no login, so anyone on the same Wi-Fi could open it (Phase 10 critique, D77).
address = "localhost"
# Uploads are capped at 5 MB per file (the knowledge base rejects bigger files too).
maxUploadSize = 5

[client]
# Never show stack traces to the user; app/main.py shows a friendly message and logs details.
showErrorDetails = "none"
# Hide the "Deploy" button and developer menu items: this is a local, single-user app.
toolbarMode = "minimal"

[browser]
# Don't send usage statistics to Streamlit.
gatherUsageStats = false
