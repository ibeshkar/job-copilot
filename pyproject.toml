[project]
name = "job-copilot"
version = "0.1.0"
description = "An AI agent that checks job fit with evidence from your own documents, writes honest applications and tracks them."
readme = "README.md"
authors = [
    { name = "ibeshkar", email = "i.beshkar@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # UI
    "streamlit>=1.40",
    # Agent framework + LLM
    "langgraph>=0.6",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    # Knowledge base
    "chromadb>=1.0",
    "langchain-chroma>=0.2",
    # App database
    "sqlmodel>=0.0.22",
    # Web extraction + external APIs
    "httpx>=0.27",
    "trafilatura>=2.0",
    "langchain-tavily>=0.2",
    # Documents
    "pypdf>=5.0",
    "python-docx>=1.1",
    "reportlab>=4.2",  # cover letter PDF (pure Python, no LibreOffice)
    # Reliability + config
    "tenacity>=9.0",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "langchain-text-splitters>=0.3",
    "email-validator>=2.1",
    "phonenumbers>=8.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "deepeval>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# The code lives in the top-level `app/` package,
# not in the default `src/<name>/` layout.
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
asyncio_default_fixture_loop_scope = "function"
# deepeval registers a pytest plugin that emits hundreds of Python 3.14 deprecation warnings.
filterwarnings = [
    "ignore::DeprecationWarning:deepeval.*",
    "ignore::DeprecationWarning:langsmith.*",
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::SyntaxWarning",
]
markers = [
    "live: calls real external APIs (skipped by default; run with -m live)",
]
